name: 카카오톡 최초 연결 (1회만)
on:
  workflow_dispatch:
    inputs:
      code:
        description: "브라우저 주소창의 code= 뒤 값"
        required: true
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: 토큰 발급 + 저장 + 테스트 메시지
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CODE: ${{ github.event.inputs.code }}
        run: |
          ARGS=(-d grant_type=authorization_code -d client_id="$KAKAO_REST_KEY" -d redirect_uri=https://localhost -d code="$CODE")
          [ -n "$KAKAO_CLIENT_SECRET" ] && ARGS+=(-d client_secret="$KAKAO_CLIENT_SECRET")
          RES=$(curl -s -X POST https://kauth.kakao.com/oauth/token "${ARGS[@]}")
          AT=$(echo "$RES" | jq -r .access_token); RT=$(echo "$RES" | jq -r .refresh_token)
          if [ "$RT" = "null" ]; then echo "실패: $(echo "$RES" | jq -c '{error,error_description}')"; exit 1; fi
          gh secret set KAKAO_REFRESH_TOKEN --body "$RT" --repo "$GITHUB_REPOSITORY"
          curl -s -X POST https://kapi.kakao.com/v2/api/talk/memo/default/send -H "Authorization: Bearer $AT" \
            --data-urlencode 'template_object={"object_type":"text","text":"펜션 예약 현황 알림이 연결됐습니다. 매일 밤 23:59에 보내드릴게요.","link":{"web_url":"https://github.com"}}'
